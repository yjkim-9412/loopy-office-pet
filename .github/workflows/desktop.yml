name: Build desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
permissions:
  contents: read
# one build per branch at a time, so two quick merges can't release over each other
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, target: win, format: 'nsis portable' }
          - { os: macos-15, arch: arm64, target: mac, format: dmg }
          - { os: macos-15, arch: x64, target: mac, format: dmg }
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LOOPY_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Smoke check native window reader
        if: runner.os == 'Windows'
        run: ./build/native/ExplorerEdge.exe --once
      - name: Smoke check Finder reader
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: ./build/native/FinderEdge --once
      - name: Build installer
        run: npx --no-install electron-builder --${{ matrix.target }} ${{ matrix.format }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: loopy-office-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
            package-lock.json
          retention-days: 14
  # a GitHub Release for a newer package.json version, once every build on a push to main has passed
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: node scripts/release.cjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
