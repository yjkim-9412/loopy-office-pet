name: Build desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, target: win, format: 'nsis portable' }
          - { os: macos-15, arch: arm64, target: mac, format: dmg }
          - { os: macos-15, arch: x64, target: mac, format: dmg }
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LOOPY_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Smoke check native window reader
        if: runner.os == 'Windows'
        run: ./build/native/ExplorerEdge.exe --once
      - name: Smoke check Finder reader
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: ./build/native/FinderEdge --once
      - name: Build installer
        run: npx --no-install electron-builder --${{ matrix.target }} ${{ matrix.format }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: loopy-office-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            package-lock.json
          retention-days: 14
